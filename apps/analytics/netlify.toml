[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && DATABASE_URL=\"${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL}\" APP_BASE_PATH=/analytics VITE_APP_BASE_PATH=/analytics NITRO_PRESET=netlify pnpm --filter analytics build && if [ \"${CONTEXT:-}\" = \"production\" ]; then DATABASE_URL=\"${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL}\" pnpm --filter analytics migrate:production; fi"
publish = "apps/analytics/dist"
functions = "apps/analytics/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"
AGENT_PROD_CODE_EXECUTION = "sandboxed"
AGENT_CHAT_DURABLE_BACKGROUND = "true"

  APP_BASE_PATH = "/analytics"
  VITE_APP_BASE_PATH = "/analytics"
[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
AGENT_NATIVE_SSR_CACHE = "30s"
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

[functions."*"]
timeout = 75

[functions.server-agent-background]
memory = "4gb"

[functions.dashboard-report-sweep-background]
timeout = 300
memory = "2gb"

[functions.analytics-alert-sweep-background]
timeout = 120

[functions.uptime-monitor-sweep-background]
timeout = 120

[functions.analytics-rollup-backfill-background]
timeout = 300
memory = "2gb"

[functions.session-replay-retention-sweep-background]
timeout = 120
