[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/brain VITE_APP_BASE_PATH=/brain NITRO_PRESET=netlify pnpm --filter brain build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm --filter brain migrate:production; fi"
publish = "apps/brain/dist"
functions = "apps/brain/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

  APP_BASE_PATH = "/brain"
  VITE_APP_BASE_PATH = "/brain"
[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

[functions."*"]
timeout = 75

[functions.brain-queue-sweep-background]
timeout = 900
memory = "2gb"
