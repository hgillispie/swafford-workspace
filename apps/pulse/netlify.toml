[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/pulse VITE_APP_BASE_PATH=/pulse NITRO_PRESET=netlify pnpm --filter pulse build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm --filter pulse migrate:production; fi"
publish = "apps/pulse/dist"
functions = "apps/pulse/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

  APP_BASE_PATH = "/pulse"
  VITE_APP_BASE_PATH = "/pulse"
[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
BETTER_AUTH_TRUSTED_ORIGINS = "https://swafford-workspace.netlify.app"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
