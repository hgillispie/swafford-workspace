[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/dispatch VITE_APP_BASE_PATH=/dispatch NITRO_PRESET=netlify pnpm --filter dispatch build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm --filter dispatch migrate:production; fi"
publish = "apps/dispatch/dist"
functions = "apps/dispatch/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"
AGENT_CHAT_DURABLE_BACKGROUND = "true"

  APP_BASE_PATH = "/dispatch"
  VITE_APP_BASE_PATH = "/dispatch"
[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

[functions."*"]
timeout = 75

[[redirects]]
  from = "/"
  to = "/dispatch/overview"
  status = 302

