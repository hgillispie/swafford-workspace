# Intended production build: Netlify's Linux builders install sharp and
# ffmpeg-static for linux-x64, then this command writes dist/ and
# .netlify/functions-internal without publishing. The site env already
# supplies APP_URL, BETTER_AUTH_URL, DATABASE_URL, BETTER_AUTH_SECRET, and
# A2A_SECRET. A2A_SECRET is required for background A2A processors.
#
# Git-connected builds are not linked yet. The team is on Netlify Pro, so a
# private GitHub repo can be connected from the Netlify UI. Until that link
# exists, build on a machine and publish the directories above with
# `netlify deploy --prod --no-build --dir dist --functions .netlify/functions-internal`.
# Do not set AGENT_CHAT_DURABLE_BACKGROUND=false. Leaving it unset keeps
# durable background agent runs on, which also requires A2A_SECRET.
[build]
  command = "pnpm exec agent-native deploy --preset netlify --build-only"
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"
  AGENT_NATIVE_SERVERLESS_FFMPEG_ARCH = "x64"
